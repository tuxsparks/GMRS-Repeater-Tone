<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scanner courtesy tone</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10292c;color:#f4f6ee;font:17px/1.55 "DM Sans",system-ui,sans-serif}main{max-width:560px;margin:6vh auto;padding:24px}h1{font-size:clamp(30px,7vw,44px);letter-spacing:-.045em;margin:0}section{background:#19383a;border:1px solid #396060;padding:20px;border-radius:14px;margin:18px 0}label{display:block;margin:14px 0 2px}input,meter{width:100%;accent-color:#aedf92}output{float:right;color:#b9e8a2;font-variant-numeric:tabular-nums}button{font:inherit;font-weight:650;background:#b9e8a2;color:#10292c;border:0;border-radius:8px;padding:10px 18px}button:disabled{opacity:.5}p{margin:8px 0 16px}#state{color:#c8edbc}
</style>
<main><h1>Scanner courtesy tone</h1><p>Place the microphone by the scanner. A tone plays through this device’s speaker after the audio goes quiet.</p>
<button id="toggle">Start listening</button>
<section><strong id="state" role="status">Stopped</strong><label for="level">Microphone level <output id="reading">—</output></label><meter id="level" min="-80" max="0" value="-80"></meter>
<label for="threshold">Trigger level <output id="thresholdOut"></output></label><input id="threshold" type="range" min="-65" max="-12" value="-38">
<label for="delay">Wait after audio <output id="delayOut"></output></label><input id="delay" type="range" min="0.3" max="3" step="0.1" value="1">
<label for="length">Beep length <output id="lengthOut"></output></label><input id="length" type="range" min="0.2" max="2" step="0.1" value="1"></section>
<p>Set the trigger above the quiet-room reading and below scanner speech. Keep this tab visible and the screen awake.</p></main>
<script>
const el = id => document.getElementById(id);
for (const [id,unit] of [['threshold',' dB'],['delay',' s'],['length',' s']]) {
  const update = () => el(id+'Out').textContent = el(id).value + unit;
  el(id).oninput = update;
  update();
}
let ctx, stream, analyser, samples, timer;
let firstLoud = null, lastLoud = 0, armed = false, ignoreUntil = 0;
function stop(message = 'Stopped') {
  clearInterval(timer);
  if (stream) stream.getTracks().forEach(track => track.stop());
  if (ctx) ctx.close().catch(() => {});
  ctx = stream = null;
  firstLoud = null;
  armed = false;
  ignoreUntil = 0;
  el('toggle').textContent = 'Start listening';
  el('level').value = -80;
  el('reading').textContent = '—';
  el('state').textContent = message;
}
function beep(now) {
  const t = ctx.currentTime, duration = Number(el('length').value);
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.frequency.value = 880;
  gain.gain.setValueAtTime(0,t);
  gain.gain.linearRampToValueAtTime(0.22,t+0.02);
  gain.gain.setValueAtTime(0.22,t+duration-0.02);
  gain.gain.linearRampToValueAtTime(0,t+duration);
  osc.connect(gain).connect(ctx.destination);
  osc.onended = () => { osc.disconnect(); gain.disconnect(); };
  osc.start(t);
  osc.stop(t+duration);
  ignoreUntil = now + duration*1000 + 650;
}
function poll() {
  const now = performance.now();
  analyser.getFloatTimeDomainData(samples);
  let sum = 0;
  for (const x of samples) sum += x*x;
  const db = Math.max(-80, 10*Math.log10(sum/samples.length));
  el('level').value = db;
  el('reading').textContent = Math.round(db)+' dB';
  if (now < ignoreUntil) {
    el('state').textContent = 'Tone / microphone paused';
    return;
  }
  if (db >= Number(el('threshold').value)) {
    firstLoud ??= now;
    lastLoud = now;
    if (now-firstLoud >= 100) armed = true;
  } else {
    firstLoud = null;
    if (armed && now-lastLoud >= Number(el('delay').value)*1000) {
      armed = false;
      beep(now);
      return;
    }
  }
  el('state').textContent = !armed ? 'Listening' : firstLoud === null ? 'Waiting for silence interval' : 'Receiving audio';
}
el('toggle').onclick = async () => {
  if (ctx) { stop(); return; }
  el('toggle').disabled = true;
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw Error('Open this page in a browser on localhost or HTTPS for microphone access.');
    ctx = new AudioContext();
    await ctx.resume();
    stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    analyser = ctx.createAnalyser();
    analyser.fftSize = 2048;
    ctx.createMediaStreamSource(stream).connect(analyser);
    samples = new Float32Array(analyser.fftSize);
    stream.getAudioTracks()[0].onended = () => stop('Microphone disconnected');
    timer = setInterval(poll,30);
    el('toggle').textContent = 'Stop listening';
  } catch (err) { stop('Microphone unavailable. '+err.message); }
  finally { el('toggle').disabled = false; }
};
</script></html>
